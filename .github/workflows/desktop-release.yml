name: 桌面端构建与发布

# Windows 包无法在 macOS 上交叉编译：Tauri 需要 MSVC 工具链，
# 而 lxml / primp / pydantic-core 是各平台各自的二进制轮子。
# 所以每个平台都在对应的 runner 上原生构建。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14 # Apple Silicon
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装打包工具
        run: npm ci

      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci

      - name: 准备内嵌运行时（图标 + Python + 后端 + 界面）
        run: npm run runtime:prepare

      - name: 冒烟测试——内嵌解释器能否导入后端
        working-directory: runtime/backend
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ../python/python.exe -c "import app.main; print('backend import ok')"
          else
            ../python/bin/python3 -c "import app.main; print('backend import ok')"
          fi

      - name: 构建并签名更新包
        env:
          # 更新签名用的是 Tauri 自己的 minisign 密钥，与系统代码签名无关。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npx tauri build --target ${{ matrix.target }}

      - name: 校验平台安装包与更新包
        shell: bash
        run: |
          bundle="src-tauri/target/${{ matrix.target }}/release/bundle"
          if [ "${{ runner.os }}" = "Windows" ]; then
            compgen -G "$bundle/nsis/*-setup.exe" >/dev/null
            compgen -G "$bundle/nsis/*-setup.exe.sig" >/dev/null
          else
            compgen -G "$bundle/dmg/*.dmg" >/dev/null
            compgen -G "$bundle/macos/*.app.tar.gz" >/dev/null
            compgen -G "$bundle/macos/*.app.tar.gz.sig" >/dev/null
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: hotstory-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz*
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 生成更新清单 latest.json
        run: node scripts/build-update-manifest.mjs artifacts dist
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          name: HotStory ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/latest.json
            dist/*.app.tar.gz
            dist/*-setup.exe
            artifacts/**/*.dmg
          fail_on_unmatched_files: true
