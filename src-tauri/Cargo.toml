[package]
name = "hotstory"
version = "0.1.1"
description = "HotStory 热点纪实剧本生成器"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
tauri-plugin-updater = "2"
# generate_context! 展开 updater 配置时会用到，必须显式声明
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
