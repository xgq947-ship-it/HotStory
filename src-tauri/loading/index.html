<!doctype html>
<meta charset="utf-8" />
<title>HotStory</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center;
    background: #f5f5f7; color: #111113;
    font: 14px/1.6 -apple-system, "Segoe UI", "PingFang SC", sans-serif;
  }
  .mark { width: 44px; height: 44px; border-radius: 12px; background: #111113;
          color: #fff; display: grid; place-items: center; font-weight: 700; }
  .spin { width: 22px; height: 22px; margin: 18px auto 0; border-radius: 50%;
          border: 2px solid #e6e6e9; border-top-color: #111113; animation: s .8s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  p { color: #6e6e73; margin: 12px 0 0; }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
</style>
<div style="text-align:center">
  <div class="mark">HS</div>
  <div class="spin"></div>
  <p id="msg">正在启动本地服务…</p>
</div>
<script>
  window.__hotstoryStatus = (text) => { document.getElementById("msg").textContent = text; };
</script>
